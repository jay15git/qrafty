packages:
  - "."
  - "packages/*"

minimumReleaseAge: 10080

# trustPolicy: no-downgrade blocked by calligraph@1.4.1 and 4 transitive trust downgrades in lockfile.
trustPolicy: warn

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - msw
patchedDependencies:
  calligraph@1.4.1: patches/calligraph@1.4.1.patch
